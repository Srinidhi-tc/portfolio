name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # deploy-pages sometimes looks for the artifact before GitHub has
      # registered it ("No artifacts named github-pages were found"). Try,
      # wait, and try again.
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.first.outcome == 'failure'
        run: sleep 30

      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
