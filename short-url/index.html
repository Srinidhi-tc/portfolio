<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Srinidhi Chakravarthy — Product Designer</title>

    <!-- Canonical points at the real site, so search engines credit that URL
         and not this forwarder. -->
    <link rel="canonical" href="https://srinidhi-tc.github.io/portfolio/work/" />

    <!-- Fallback only: _redirects issues a real 301, which crawlers follow to
         the live page and read its Open Graph tags from there. These tags exist
         solely for a host that ignores _redirects. The image deliberately uses
         the stable /og/share.png alias rather than a content-hashed filename,
         so regenerating the cards can never leave this page pointing at a 404. -->
    <meta name="description" content="Case studies across AI systems, cybersecurity, enterprise observability, scientific software, and physical product design." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Srinidhi Chakravarthy — Portfolio" />
    <meta property="og:title" content="Work — Srinidhi Chakravarthy" />
    <meta property="og:description" content="Case studies across AI systems, cybersecurity, enterprise observability, scientific software, and physical product design." />
    <meta property="og:url" content="https://srinidhi-tc.github.io/portfolio/work/" />
    <meta property="og:image" content="https://srinidhi-tc.github.io/portfolio/og/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Work — Srinidhi Chakravarthy" />
    <meta name="twitter:description" content="Case studies across AI systems, cybersecurity, enterprise observability, scientific software, and physical product design." />
    <meta name="twitter:image" content="https://srinidhi-tc.github.io/portfolio/og/share.png" />

    <!-- Belt and braces: the meta refresh fires even with JS disabled, and the
         script fires immediately so nobody sees the 0s refresh tick. replace()
         is used rather than assigning href so the forwarder never lands in the
         back-button history. -->
    <meta http-equiv="refresh" content="0; url=https://srinidhi-tc.github.io/portfolio/work/" />
    <script>
      window.location.replace("https://srinidhi-tc.github.io/portfolio/work/");
    </script>

    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfbfd;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1b1e; color: #e6e7ea; }
        a { color: #7ab3ff; }
      }
      p { color: #6e6e73; margin: 8px 0 20px; }
      @media (prefers-color-scheme: dark) { p { color: #b0b3b9; } }
      a { color: #0055b3; font-weight: 600; }
    </style>
  </head>
  <body>
    <!-- Only ever seen if both the script and the meta refresh are blocked. -->
    <main>
      <h1>Srinidhi Chakravarthy</h1>
      <p>Taking you to the portfolio&hellip;</p>
      <a href="https://srinidhi-tc.github.io/portfolio/work/">Open the portfolio</a>
    </main>
  </body>
</html>
