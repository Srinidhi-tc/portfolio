<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1600" height="900" fill="#FFFFFF"/><text x="80" y="90" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0066CC" text-anchor="start">RADIAL INDICATORS — WCAG 2.1 REVIEW</text><text x="80" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1D1D1F" text-anchor="start">Colour alone can't carry health status. Fill and fraction can.</text><text x="80" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#86868B" text-anchor="start">EXISTING AZURE PALETTE (approx.)</text><line x1="80" y1="217" x2="900" y2="217" stroke="#E5E5EA" stroke-width="1"/><circle cx="160" cy="290" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><circle cx="160" cy="290" r="38" fill="none" stroke="#E00B1C" stroke-width="10" stroke-linecap="round" stroke-dasharray="179.1 238.8" transform="rotate(-90 160 290)"/><text x="160" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#E00B1C" text-anchor="middle">3/4</text><text x="220" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">4.96:1  pass</text><circle cx="430" cy="290" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><circle cx="430" cy="290" r="38" fill="none" stroke="#FF8C00" stroke-width="10" stroke-linecap="round" stroke-dasharray="119.4 238.8" transform="rotate(-90 430 290)"/><text x="430" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FF8C00" text-anchor="middle">2/4</text><text x="490" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C50F1F" text-anchor="start">2.33:1  FAIL</text><circle cx="700" cy="290" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><text x="700" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#57A300" text-anchor="middle">0/4</text><text x="760" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">3.16:1  pass</text><text x="80" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="start">Orange on white fails WCAG 1.4.11 non-text contrast (needs 3:1).</text><text x="80" y="425" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#86868B" text-anchor="start">SAME RADIALS · DEUTERANOPIA SIMULATION</text><line x1="80" y1="437" x2="900" y2="437" stroke="#E5E5EA" stroke-width="1"/><circle cx="160" cy="510" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><circle cx="160" cy="510" r="38" fill="none" stroke="#8F7F09" stroke-width="10" stroke-linecap="round" stroke-dasharray="179.1 238.8" transform="rotate(-90 160 510)"/><text x="160" y="582" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8F7F09" text-anchor="middle">3/4</text><text x="220" y="504" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">red → olive</text><circle cx="430" cy="510" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><circle cx="430" cy="510" r="38" fill="none" stroke="#CAB400" stroke-width="10" stroke-linecap="round" stroke-dasharray="119.4 238.8" transform="rotate(-90 430 510)"/><text x="430" y="582" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#CAB400" text-anchor="middle">2/4</text><text x="490" y="504" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">orange → yellow</text><circle cx="700" cy="510" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><text x="700" y="582" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#A08F20" text-anchor="middle">0/4</text><text x="760" y="504" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">green → olive</text><text x="80" y="610" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="start">~1 in 12 men has red-green colour vision deficiency. Red and orange become hard to tell apart.</text><text x="80" y="645" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#86868B" text-anchor="start">PROPOSAL · MEANING WITHOUT COLOUR</text><line x1="80" y1="657" x2="900" y2="657" stroke="#E5E5EA" stroke-width="1"/><circle cx="160" cy="730" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><circle cx="160" cy="730" r="38" fill="none" stroke="#C50F1F" stroke-width="10" stroke-linecap="round" stroke-dasharray="179.1 238.8" transform="rotate(-90 160 730)"/><path d="M149 719 L171 741 M171 719 L149 741" stroke="#C50F1F" stroke-width="5" stroke-linecap="round"/><text x="160" y="802" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#C50F1F" text-anchor="middle">3/4</text><text x="220" y="724" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">6.07:1  pass</text><circle cx="430" cy="730" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><circle cx="430" cy="730" r="38" fill="none" stroke="#B35900" stroke-width="10" stroke-linecap="round" stroke-dasharray="119.4 238.8" transform="rotate(-90 430 730)"/><path d="M430 716 L430 734" stroke="#B35900" stroke-width="5" stroke-linecap="round"/><circle cx="430" cy="743" r="3.2" fill="#B35900"/><text x="430" y="802" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B35900" text-anchor="middle">2/4</text><text x="490" y="724" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">4.83:1  pass</text><circle cx="700" cy="730" r="38" fill="none" stroke="#E5E5EA" stroke-width="10"/><path d="M688 731 L697 740 L713 721" fill="none" stroke="#107C10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="802" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#107C10" text-anchor="middle">0/4</text><text x="760" y="724" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6E6E73" text-anchor="start">5.37:1  pass</text><text x="80" y="830" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="start">Darker tones pass 3:1. Glyphs (✕ ! ✓) + fraction carry status even in greyscale.</text><rect x="980" y="200" width="540" height="620" rx="24" fill="#F5F5F7"/><text x="1020" y="255" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0066CC" text-anchor="start">THE TRADE-OFF</text><text x="1020" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">Azure already has a portal-wide</text><text x="1020" y="336" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">status palette.</text><text x="1020" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">Changing it for one feature would break</text><text x="1020" y="422" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">consistency across hundreds of Azure screens.</text><text x="1020" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start"></text><text x="1020" y="482" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1D1D1F" text-anchor="start">What we handed over:</text><text x="1020" y="512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">Kept the Azure palette. Relied on ring fill +</text><text x="1020" y="542" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">fraction (3/4) — both readable without colour.</text><text x="1020" y="572" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start"></text><text x="1020" y="602" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1D1D1F" text-anchor="start">What we recommended:</text><text x="1020" y="632" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">Status glyphs and a darker orange (#B35900)</text><text x="1020" y="662" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">for the Azure design system team to review.</text><text x="1020" y="692" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start"></text><text x="1020" y="722" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1D1D1F" text-anchor="start">Consistency now. Accessibility on the roadmap.</text><text x="80" y="882" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="start">Contrast ratios calculated against white (#FFFFFF). Deuteranopia simulated with the Machado et al. (2009) model. Azure hex values approximate.</text></svg>